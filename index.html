<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpendWise — Interactive Budget Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>SpendWise</h1>

    <section class="budget-setup">
      <label for="budgetInput">Monthly Budget:</label>
      <input type="number" id="budgetInput" min="1" step="0.01" value="500" />
      <button type="button" id="setBudgetBtn">Update Budget</button>
    </section>

    <section class="summary">
      <p>Budget: <strong id="budgetDisplay">$500.00</strong></p>
      <p>Total Spent: <strong id="totalSpentDisplay">$0.00</strong></p>
      <p>Remaining: <strong id="remainingDisplay">$500.00</strong></p>
      <div id="statusAlert" class="alert ok">You are well within your budget.</div>
    </section>

    <form id="expenseForm" class="expense-form">
      <input type="text" id="expenseTitle" placeholder="Expense title (e.g., Groceries)" required />
      <input type="number" id="expenseAmount" placeholder="Amount" min="0.01" step="0.01" required />
      <select id="expenseCategory">
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Bills">Bills</option>
        <option value="Other">Other</option>
      </select>
      <button type="submit">Add Expense</button>
      <button type="button" id="clearExpensesBtn">Clear All</button>
    </form>

    <section>
      <h2>Expenses</h2>
      <ul id="expenseList"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
